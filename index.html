<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acortador de enlaces</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap wide">
    <h1>acortador<span class="dot">.</span>link</h1>
    <p class="sub">Pega tu enlace largo y obtén tu enlace para compartir.</p>

    <form id="form" class="shorten-form" autocomplete="off">
      <input
        id="url-input"
        type="url"
        name="url"
        placeholder="https://ejemplo.com/pagina-muy-larga"
        required
      >
      <button type="submit">Generar</button>
    </form>

    <div id="result" class="result hidden">
      <input id="result-input" type="text" readonly>
      <button id="copy-btn" type="button">Copiar</button>
    </div>

    <p id="error" class="error hidden"></p>

    <h2 class="history-title">Tus enlaces (guardados en este navegador)</h2>
    <table class="history-table">
      <thead>
        <tr>
          <th>Destino</th>
          <th>Clics</th>
          <th>Creado</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <p id="history-empty" class="sub hidden">Todavía no has creado ningún enlace.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
