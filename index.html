<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acortador de enlaces</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ Pantalla de login ============ -->
  <main id="login-view" class="wrap">
    <h1>acortador<span class="dot">.</span>link</h1>
    <p class="sub">Inicia sesión para crear y administrar tus enlaces.</p>

    <form id="login-form" class="shorten-form" autocomplete="on">
      <input id="login-email" type="email" placeholder="Correo" required>
      <input id="login-password" type="password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>

    <p id="login-error" class="error hidden"></p>
  </main>

  <!-- ============ Panel principal (tras iniciar sesión) ============ -->
  <main id="app-view" class="wrap wide hidden">
    <div class="topbar">
      <h1>acortador<span class="dot">.</span>link</h1>
      <button id="logout-btn" class="ghost-btn" type="button">Cerrar sesión</button>
    </div>

    <form id="form" class="shorten-form" autocomplete="off">
      <input
        id="url-input"
        type="url"
        name="url"
        placeholder="https://ejemplo.com/pagina-muy-larga"
        required
      >
      <button type="submit">Generar</button>
    </form>

    <div id="result" class="result hidden">
      <input id="result-input" type="text" readonly>
      <button id="copy-btn" type="button">Copiar</button>
    </div>

    <p id="error" class="error hidden"></p>

    <h2 class="history-title">Tus enlaces</h2>
    <table class="history-table">
      <thead>
        <tr>
          <th>Destino</th>
          <th>Clics</th>
          <th>Creado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <p id="history-empty" class="sub hidden">Todavía no has creado ningún enlace.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
